name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install release MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          version_output="$("$HOME/.moon/bin/moon" version --all)"
          echo "$version_output"
          minimum_moonc_version="0.10.14"
          moonc_version="$(printf '%s\n' "$version_output" | sed -n 's/^moonc v\([0-9][0-9.]*\).*/\1/p')"
          test -n "$moonc_version" || {
            echo "unable to determine moonc version"
            exit 1
          }
          if [ "$(printf '%s\n%s\n' "$minimum_moonc_version" "$moonc_version" | sort -V | head -n 1)" != "$minimum_moonc_version" ]; then
            echo "moonc $moonc_version is older than required $minimum_moonc_version"
            exit 1
          fi
      - name: Restore dependencies
        run: moon update
      - name: Verify generated interfaces are committed
        run: |
          moon info --target all
          git diff --exit-code
      - name: Verify module/API version synchronization
        run: |
          module_version=$(sed -n 's/^version = "\(.*\)"/\1/p' moon.mod)
          api_version=$(sed -n 's/^pub const VERSION : String = "\(.*\)"/\1/p' binschema.mbt)
          test -n "$module_version"
          test -n "$api_version"
          if [ "$module_version" != "$api_version" ]; then
            echo "version mismatch: moon.mod=$module_version binschema.mbt=$api_version"
            exit 1
          fi
      - name: Build API documentation
        run: moon doc
      - name: Audit publish package
        run: |
          moon package --list 2>&1 | tee /tmp/binschema-package-files.txt
          grep -q "codec.mbt" /tmp/binschema-package-files.txt
          grep -q "docs/PERFORMANCE.md" /tmp/binschema-package-files.txt
          grep -q "docs/REFERENCE_VALIDATION.md" /tmp/binschema-package-files.txt
          grep -Eq "examples[/\\\\]tcp_framing[/\\\\]protocol[/\\\\]protocol.mbt" /tmp/binschema-package-files.txt
          if grep -q "^moon.work$" /tmp/binschema-package-files.txt; then
            echo "workspace manifest leaked into the publish archive"
            exit 1
          fi
          if grep -Eq "(^|/)(\.github|\.githooks|benchmarks|scripts|tools|web)/" /tmp/binschema-package-files.txt; then
            echo "repository-only files leaked into the publish archive"
            exit 1
          fi
      - name: Check all backends
        run: moon check --target all --deny-warn
      - name: Test all backends including property and corpus suites
        run: moon test --target all --deny-warn
      - name: Run deterministic mutation fuzz smoke
        run: moon run --target native tools/mutation_fuzz -- --seed 1 --iterations 512
      - name: Verify executable README
        run: moon test README.mbt.md --target native --deny-warn
      - name: Compile native benchmarks
        run: moon bench --build-only --target native --deny-warn
      - name: Verify coverage workflow
        run: |
          moon test --target native --enable-coverage --deny-warn
          moon coverage analyze -p prowk/binschema -- -f summary
          moon coverage analyze -p prowk/binschema/formats -- -f summary
      - name: Verify formatting
        run: moon fmt --check
      - name: Verify README synchronization
        run: cmp README.md README.mbt.md
      - name: Build native CLI
        run: moon build --target native cmd/main --release
      - name: Build reproducible example
        run: moon build --target native examples/custom_packet --release
      - name: Build demo protocol
        run: moon build --target native examples/demo_protocol --release
      - name: Test demo protocol
        run: moon test --target native examples/demo_protocol --deny-warn
      - name: Build TCP framing integration example
        run: moon build --target native examples/tcp_framing/app --release --deny-warn
      - name: Test TCP framing integration example
        run: |
          moon test --target native examples/tcp_framing/protocol --deny-warn
          moon test --target native examples/tcp_framing/app --deny-warn
      - name: Run TCP loopback integration scenarios
        run: moon run --target native examples/tcp_framing/app -- demo
      - name: Build Wasm-GC bridge
        run: moon build --target wasm-gc web/bridge --release
      - name: Verify playground assets
        run: |
          node --check web/app.js
          node web/check-static.mjs

      - name: Verify resource regression smoke
        run: bash scripts/resource-smoke.sh

  latest-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install latest MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Restore dependencies
        run: moon update
      - name: Check forward compatibility
        run: moon check --target all --deny-warn

  reference-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Install independent reference tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils file pngcheck sox tcpdump
          python3 --version
          dpkg-query -W binutils file pngcheck sox tcpdump
      - name: Restore dependencies
        run: moon update
      - name: Cross-check generated reference vectors
        run: bash scripts/reference/verify.sh
