name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Restore dependencies
        run: moon update
      - name: Verify generated interfaces are committed
        run: |
          moon info
          git diff --exit-code
      - name: Build API documentation
        run: moon doc
      - name: Audit publish package
        run: moon package --list
      - name: Check all backends
        run: moon check --target all --deny-warn
      - name: Test all backends
        run: moon test --target all --deny-warn
      - name: Verify coverage workflow
        run: |
          moon test --target native --enable-coverage --deny-warn
          moon coverage analyze
      - name: Verify formatting
        run: moon fmt --check
      - name: Verify README synchronization
        run: cmp README.md README.mbt.md
      - name: Build native CLI
        run: moon build --target native cmd/main --release
      - name: Build reproducible example
        run: moon build --target native examples/custom_packet --release
      - name: Build Wasm-GC bridge
        run: moon build --target wasm-gc web/bridge --release
